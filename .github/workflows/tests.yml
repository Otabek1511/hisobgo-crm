name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS sintaksisini tekshirish
        run: |
          for f in frontend/index.html frontend/admin.html; do
            python3 - "$f" <<'PY'
          import re, sys
          h = open(sys.argv[1], encoding="utf8").read()
          js = re.findall(r"<script(?![^>]*src)[^>]*>(.*?)</script>", h, re.S)[-1]
          open("/tmp/check.js", "w", encoding="utf8").write(js)
          PY
            node --check /tmp/check.js
          done
