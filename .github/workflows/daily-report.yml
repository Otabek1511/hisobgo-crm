name: Kunlik hisobot (20:00 Toshkent)

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 20:00 Toshkent (UTC+5)
  workflow_dispatch: {}     # qo'lda ishga tushirish (Actions -> Run workflow)

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Backendni uyg'otib, hisobotlarni yuborish
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 150 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST -H "X-Cron-Key: $CRON_KEY" "$API_URL/api/internal/daily-report"
